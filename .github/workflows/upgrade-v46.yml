name: Upgrade LAME Pinball to v46
on:
  push:
    paths:
      - 'upgrade_v46.trigger'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v46 upgrade
        run: python upgrade_v46.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text()
          m=re.search(r'<script>([\s\S]*)</script>',s)
          if not m: raise SystemExit('script block not found')
          pathlib.Path('/tmp/lame-v46.js').write_text(m.group(1))
          PY
          node --check /tmp/lame-v46.js
      - name: Commit v46
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade LAME Pinball to v46" || exit 0
          git push
