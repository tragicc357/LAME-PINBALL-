name: Upgrade LAME Pinball to v69
on:
  push:
    paths:
      - 'upgrade_v69.py'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply v69 upgrade
        run: python upgrade_v69.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m, 'script not found'
          open('/tmp/lame-v69.js','w',encoding='utf-8').write(m.group(1))
          PY
          node --check /tmp/lame-v69.js
      - name: Verify v69 features
        run: |
          grep -q 'Howie Lucas Pinball v69' index.html
          grep -q 'Lame%20box.png' index.html
          grep -q 'tableArt' index.html
      - name: Commit upgraded game
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Upgrade LAME Pinball to v69'
          git push
