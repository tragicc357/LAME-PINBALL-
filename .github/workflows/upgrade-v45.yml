name: Upgrade LAME Pinball to v45
on:
  push:
    paths:
      - 'upgrade_v45.trigger'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v45 upgrade
        run: python upgrade_v45.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/game.js').write_text(js)
          PY
          node --check /tmp/game.js
      - name: Commit v45
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Upgrade LAME Pinball to v45 with longer flippers'
          git push
