name: Upgrade LAME Pinball to v47
on:
  push:
    paths:
      - 'upgrade_v47.trigger'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply v47 upgrade
        run: python upgrade_v47.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/lame-v47.js').write_text(js)
          PY
          node --check /tmp/lame-v47.js
      - name: Commit v47
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade LAME Pinball to v47" || exit 0
          git push
