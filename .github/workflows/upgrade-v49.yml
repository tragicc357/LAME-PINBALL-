name: Upgrade LAME Pinball to v49
on:
  push:
    paths:
      - 'upgrade_v49.py'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply v49 upgrade
        run: python upgrade_v49.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          pathlib.Path('/tmp/game.js').write_text(m.group(1))
          PY
          node --check /tmp/game.js
      - name: Commit v49
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Upgrade LAME Pinball to v49'
          git push
