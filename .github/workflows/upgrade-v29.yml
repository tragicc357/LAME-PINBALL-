name: Upgrade LAME Pinball to v29
on:
  push:
    paths:
      - 'upgrade_v29.py'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply v29 preview upgrade
        run: python upgrade_v29.py
      - name: Commit upgraded game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html facebook-preview.jpg
          git commit -m "Upgrade LAME Pinball to v29" || exit 0
          git push
