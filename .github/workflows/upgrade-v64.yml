name: Upgrade LAME Pinball to v64
on:
  push:
    paths:
      - upgrade_v64.py
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply v64 moving-hole upgrade
        run: python upgrade_v64.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script>')+len('<script>')
          b=s.index('</script>',a)
          Path('/tmp/game-v64.js').write_text(s[a:b])
          PY
          node --check /tmp/game-v64.js
      - name: Verify v64 features
        run: |
          grep -q "Pinball v64" index.html
          grep -q "EVERY CAPTURE RELOCATES IT" index.html
          grep -q "MOVES" index.html
      - name: Commit v64
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update LAME Pinball to v64" || exit 0
          git push
