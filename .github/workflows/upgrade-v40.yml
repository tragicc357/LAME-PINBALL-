name: Upgrade LAME Pinball to v40
on:
  push:
    paths:
      - 'upgrade_v40.py'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply v40 startup fix
        run: python upgrade_v40.py
      - name: Commit fixed game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix LAME Pinball startup in v40" || exit 0
          git push
