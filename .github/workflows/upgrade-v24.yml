name: Upgrade LAME Pinball to v24
on:
  push:
    paths:
      - 'upgrade_v24.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v24 upgrade
        run: python upgrade_v24.py
      - name: Commit upgraded game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Upgrade LAME Pinball to v24"
          git push
