name: Upgrade LAME Pinball to v11

on:
  push:
    paths:
      - 'upgrade_v11.py'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v11 upgrade
        run: python upgrade_v11.py
      - name: Commit upgraded game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Upgrade LAME Pinball to v11"
          git push
