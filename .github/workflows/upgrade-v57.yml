name: Upgrade LAME Pinball to v57

on:
  push:
    paths:
      - '.trigger-v57'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v57 leaderboard auth fix
        run: python upgrade_v57.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          import re
          s=open('index.html').read()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script block not found')
          open('/tmp/lame-v57.js','w').write(m.group(1))
          PY
          node --check /tmp/lame-v57.js
      - name: Verify leaderboard auth fix
        run: |
          grep -q 'LAME — Howie Lucas Pinball v57' index.html
          grep -q 'eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJocG5ocmlrYXVuaW11bW10eXh0' index.html
      - name: Commit v57
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade LAME Pinball to v57 leaderboard auth fix"
          git push
