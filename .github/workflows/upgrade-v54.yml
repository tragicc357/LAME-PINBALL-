name: Upgrade LAME Pinball to v55

on:
  push:
    paths:
      - '.trigger-v54'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v55 leaderboard recovery
        run: python upgrade_v55.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          import re
          s=open('index.html').read()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script block not found')
          open('/tmp/lame-v55.js','w').write(m.group(1))
          PY
          node --check /tmp/lame-v55.js
      - name: Verify leaderboard recovery
        run: |
          grep -q 'GLOBAL TOP 5' index.html
          grep -q 'startGlobalStatsRefresh' index.html
          grep -q 'GLOBAL SCORES RECONNECTING' index.html
      - name: Commit v55
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade LAME Pinball to v55 global leaderboard recovery"
          git push
