name: Upgrade LAME Pinball to v54

on:
  push:
    paths:
      - '.trigger-v54'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v54 smart camera upgrade
        run: python upgrade_v54.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          import re
          s=open('index.html').read()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script block not found')
          open('/tmp/lame-v54.js','w').write(m.group(1))
          PY
          node --check /tmp/lame-v54.js
      - name: Verify smart camera
        run: |
          grep -q 'updateSmartMultiballCamera' index.html
          grep -q 'b.y>focus.y' index.html
          grep -q 'WATCH COMPUTER PLAY — SMART AUTO MODE' index.html
      - name: Commit v54
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade LAME Pinball to v54 smart multiball camera"
          git push
