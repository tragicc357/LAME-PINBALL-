name: Upgrade LAME Pinball to v30
on:
  push:
    paths:
      - 'upgrade_v30.py'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply v30 upgrade
        run: python upgrade_v30.py
      - name: Commit upgraded game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade LAME Pinball to v30" || exit 0
          git push
