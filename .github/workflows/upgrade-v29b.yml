name: Apply LAME Pinball v29 Social Preview
on:
  push:
    paths:
      - 'upgrade_v29b.py'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply social preview
        run: python upgrade_v29b.py
      - name: Commit game metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade LAME Pinball to v29 social preview" || exit 0
          git push
