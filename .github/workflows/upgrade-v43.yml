name: Upgrade LAME Pinball to v43
on:
  push:
    paths:
      - 'upgrade_v43.trigger'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply v43 fix
        run: python upgrade_v43.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script not found')
          Path('/tmp/game.js').write_text(m.group(1))
          PY
          node --check /tmp/game.js
      - name: Commit fixed game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade LAME Pinball to v43" || exit 0
          git push
