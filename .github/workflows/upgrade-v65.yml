name: Upgrade LAME Pinball to v65

on:
  push:
    paths:
      - 'upgrade_v65.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply v65 upgrade
        run: python upgrade_v65.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script block missing')
          Path('/tmp/lame-v65.js').write_text(m.group(1))
          PY
          node --check /tmp/lame-v65.js
      - name: Verify v65 features
        run: |
          grep -q 'Howie Lucas Pinball v65' index.html
          grep -q "slice(0,2)" index.html
          grep -q 'MY TOP 5 SCORES' index.html
          grep -q 'MY TOP 5 HOWIE-OUT TIMES' index.html
          grep -q 'spawnBoxStars' index.html
          grep -q 'r:13' index.html
      - name: Commit v65
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Upgrade LAME Pinball to v65' || exit 0
          git push
