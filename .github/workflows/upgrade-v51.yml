name: Upgrade LAME Pinball to v51

on:
  push:
    paths:
      - 'upgrade_v51.py'
      - '.trigger-v51'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v51 replay upgrade
        run: python upgrade_v51.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          import re
          s=open('index.html').read()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script block not found')
          open('/tmp/lame-v51.js','w').write(m.group(1))
          PY
          node --check /tmp/lame-v51.js
      - name: Commit v51
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade LAME Pinball to v51 replay update"
          git push
